<html>
<body>

    <link rel="stylesheet" href="style.css">

    <h1>MPU Cost Calculator - Demo | MPU FACHZENTRUM</h1>

    <p>Calculate the estimated cost of your MPU.</p>

    <div id="progress">
        Step <span id="step-number">1</span> of 4
    </div>

    <h2 id="question">Step 1: What is the reason for your MPU?</h2>

    <form id="calculator-form">

        <div id="options">

            <label>
                <input type="radio" name="reason" value="alcohol">
                Alcohol
            </label>
            <br>

            <label>
                <input type="radio" name="reason" value="drugs">
                Drugs or cannabis
            </label>
            <br>

            <label>
                <input type="radio" name="reason" value="points">
                Points
            </label>
            <br>

            <label>
                <input type="radio" name="reason" value="criminal">
                Criminal offence
            </label>
            <br>

            <label>
                <input type="radio" name="reason" value="multiple">
                Multiple reasons
            </label>

        </div>

        <p id="message"></p>

        <button type="button" id="back-button" disabled>
            Back
        </button>

        <button type="button" id="next-button">
            Next
        </button>

    </form>

    <p>
        This calculator provides an estimated cost only.
        Actual costs may vary depending on your individual situation.
    </p>

    <script src="script.js"></script>

</body>
</html>
